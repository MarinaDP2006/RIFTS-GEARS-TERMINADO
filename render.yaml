# Render: despliega la web de la carpeta Web/ como sitio estático.
services:
  - type: web
    name: rifts-and-gears
    runtime: static
    rootDir: Web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # La web usa rutas como /personajes o /atlas: todas sirven index.html.
      - type: rewrite
        source: /*
        destination: /index.html
